<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acessar Conta - King Barbearia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #090a0f 0%, #161a25 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-height: 95vh;
            overflow-y: auto;
        }

        .container::-webkit-scrollbar {
            width: 6px;
        }

        .container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
            font-weight: 400;
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 45px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #0088cc;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 136, 204, 0.2);
        }

        .input-group span.icon-left {
            position: absolute;
            left: 15px;
            top: 14px;
            color: #888;
            font-size: 18px;
        }

        .icon-eye {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
            color: #888;
            font-size: 18px;
            transition: 0.2s;
        }

        .icon-eye:hover {
            color: #00bfff;
        }

        .btn-entrar {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0088cc, #00bfff);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.3);
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.5);
        }

        .link-cadastro {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #aaa;
            font-weight: 300;
        }

        .link-cadastro a {
            color: #00bfff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: slideDown 0.3s ease-out;
            font-family: 'Poppins', sans-serif;
        }

        .toast.sucesso {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .toast.erro {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        #telaCadastro {
            display: none;
        }
    </style>
</head>

<body>
    <div id="toast-container"></div>

    <div class="container">
        <div id="telaLogin">
            <h2>Acessar conta</h2>

            <label>Nome de usuário ou Celular</label>
            <div class="input-group">
                <span class="icon-left">👤</span>
                <input type="text" id="loginInput" placeholder="Digite seu nome ou celular">
            </div>

            <label>Senha</label>
            <div class="input-group">
                <span class="icon-left">🔒</span>
                <input type="password" id="loginSenha" placeholder="Informe sua senha">
                <span class="icon-eye" onclick="toggleSenha('loginSenha', this)">👁️</span>
            </div>

            <button class="btn-entrar" onclick="fazerLogin()">Acessar</button>

            <div class="link-cadastro">Não possui uma conta? <a onclick="mostrarCadastro()">Cadastre-se</a></div>
        </div>

        <div id="telaCadastro">
            <h2>Criar Conta</h2>

            <label>Nome Completo</label>
            <div class="input-group"><span class="icon-left">👤</span><input type="text" id="cadNome"
                    placeholder="Seu nome"></div>

            <label>E-mail (Opcional)</label>
            <div class="input-group"><span class="icon-left">✉️</span><input type="email" id="cadEmail"
                    placeholder="seu@email.com"></div>

            <label>WhatsApp / Celular</label>
            <div class="input-group"><span class="icon-left">📱</span><input type="tel" id="cadTelefone"
                    placeholder="Ex: 62999999999"></div>

            <label>Senha</label>
            <div class="input-group">
                <span class="icon-left">🔒</span>
                <input type="password" id="cadSenha" placeholder="Crie uma senha">
                <span class="icon-eye" onclick="toggleSenha('cadSenha', this)">👁️</span>
            </div>

            <label>Foto de Perfil (Opcional)</label>
            <div class="input-group" style="margin-bottom: 20px;">
                <input type="file" id="cadFoto" accept="image/*" style="padding: 10px; font-size: 13px;">
            </div>

            <button class="btn-entrar" onclick="fazerCadastro()">Cadastrar</button>

            <div class="link-cadastro">Já tem conta? <a onclick="mostrarLogin()">Fazer Login</a></div>
        </div>
    </div>

    <script>
        function toggleSenha(idCampo, elementoOlho) {
            const input = document.getElementById(idCampo);
            if (input.type === 'password') {
                input.type = 'text';
                elementoOlho.innerText = '🙈';
            } else {
                input.type = 'password';
                elementoOlho.innerText = '👁️';
            }
        }

        function mostrarToast(mensagem, tipo = 'sucesso') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${tipo}`;
            toast.innerHTML = `${tipo === 'sucesso' ? '✅' : '❌'} ${mensagem}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function mostrarCadastro() {
            document.getElementById('telaLogin').style.display = 'none';
            document.getElementById('telaCadastro').style.display = 'block';
        }

        function mostrarLogin() {
            document.getElementById('telaCadastro').style.display = 'none';
            document.getElementById('telaLogin').style.display = 'block';
        }

        async function fazerLogin() {
            const loginInput = document.getElementById('loginInput').value;
            const senha = document.getElementById('loginSenha').value;

            const res = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login: loginInput, senha: senha }) });
            const data = await res.json();

            if (res.ok) {
                if (data.tipo === 'barbeiro') {
                    window.location.href = '/painel';
                } else {
                    window.location.href = data.destino;
                }
            } else {
                mostrarToast(data.erro, 'erro');
            }
        }

        async function fazerCadastro() {
            const nome = document.getElementById('cadNome').value;
            let email = document.getElementById('cadEmail').value;
            const telefone = document.getElementById('cadTelefone').value;
            const senha = document.getElementById('cadSenha').value;

            if (!email || email.trim() === '') {
                email = 'sem_email@barbearia.com';
            }

            const formData = new FormData();
            formData.append('nome', nome);
            formData.append('email', email);
            formData.append('telefone', telefone);
            formData.append('senha', senha);

            const fotoInput = document.getElementById('cadFoto');
            if (fotoInput.files.length > 0) {
                formData.append('foto', fotoInput.files[0]);
            }

            const res = await fetch('/cadastro', { method: 'POST', body: formData });
            const data = await res.json();

            if (res.ok) {
                mostrarToast("Conta criada! Entrando no site...", 'sucesso');

                const loginDados = { login: nome, senha: senha };
                const loginRes = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(loginDados) });
                const loginData = await loginRes.json();

                if (loginData.sucesso) {
                    setTimeout(() => {
                        window.location.href = loginData.destino;
                    }, 1500);
                } else {
                    mostrarToast("Conta criada, mas faça login manualmente.", 'erro');
                    setTimeout(mostrarLogin, 2000);
                }
            } else {
                mostrarToast(data.erro, 'erro');
            }
        }
    </script>
</body>

</html>
