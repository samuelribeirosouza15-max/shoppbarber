<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0b0b 0%, #0d0d0d 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(30, 30, 30, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(231, 76, 60, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        h2 {
            color: #e74c3c;
            margin-top: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 300;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.3);
        }

        .btn-entrar {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-entrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5);
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #e74c3c;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🔒 Acesso Restrito</h2>
        <p>Digite a senha de Administrador para acessar o painel.</p>

        <div class="input-group">
            <input type="password" id="senhaAdmin" placeholder="****" maxlength="8">
        </div>

        <button class="btn-entrar" onclick="verificarSenha()">Entrar no Painel</button>
        <p id="mensagem"></p>
    </div>

    <script>
        async function verificarSenha() {
            const senha = document.getElementById('senhaAdmin').value;
            if (!senha) return;

            const res = await fetch('/admin_secreto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ senha: senha })
            });

            if (res.ok) {
                window.location.href = '/painel';
            } else {
                document.getElementById('mensagem').innerText = "Senha incorreta! Tente novamente.";
            }
        }

        document.getElementById('senhaAdmin').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verificarSenha();
            }
        });
    </script>
</body>

</html>
